[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricssl"
version = "1.0.0"
description = "Temperature-optimized self-supervised contrastive learning for data-efficient, explainable fabric defect detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fabric SSL contributors" }]
keywords = ["self-supervised-learning", "simclr", "byol", "swav", "fabric-defect-detection", "explainable-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "tqdm>=4.64",
]

[project.optional-dependencies]
app = ["Flask>=2.2"]
dev = ["pytest>=7.2", "pytest-cov>=4.0", "ruff>=0.1", "nbformat>=5.7", "jupyter>=1.0"]

[project.scripts]
fabricssl = "fabricssl.cli:main"

[project.urls]
Repository = "https://github.com/isratjahan829/Temperature-Optimized-SSL-Fabric-Defect-Detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP006/UP035/UP045: typing.List/Dict/Optional are kept for Python 3.9 support.
ignore = ["B008", "E501", "UP006", "UP035", "UP045"]
